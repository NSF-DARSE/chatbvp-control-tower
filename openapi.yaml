openapi: 3.0.3
info:
  title: ChatBVP Control Tower API
  description: >
    Event-driven orchestration system that converts operational events
    into structured AI workflows with Matrix coordination and email notification.
  version: "1.0.0"

servers:
  - url: http://localhost:8000
    description: Local Development Server

tags:
  - name: Intake
  - name: Events
  - name: Workspaces
  - name: Team
  - name: Audit

paths:
  /:
    get:
      tags: [Intake]
      summary: Render intake request form (HTML)
      responses:
        "200":
          description: HTML form page

  /api/events/:
    post:
      tags: [Events]
      summary: Create new event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_text]
              properties:
                title:
                  type: string
                  example: Refund request
                event_text:
                  type: string
                  example: I need a refund for invoice #123.
      responses:
        "200":
          description: Event created

  /api/events/{event_id}/run/:
    post:
      tags: [Events]
      summary: Trigger AI agent workflow for event
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Workflow executed

  /dashboard/:
    get:
      tags: [Workspaces]
      summary: View workspace dashboard (HTML)
      responses:
        "200":
          description: Dashboard page

  /dashboard/ws/{workspace_id}/:
    get:
      tags: [Workspaces]
      summary: View workspace details (HTML)
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Workspace detail page

  /dashboard/ws/{workspace_id}/retry/:
    post:
      tags: [Workspaces]
      summary: Retry workflow for workspace
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "302":
          description: Redirect to workspace detail page

  /dashboard/ws/{workspace_id}/matrix/:
    post:
      tags: [Workspaces]
      summary: Create Matrix room for workspace
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "302":
          description: Redirect to workspace detail page

  /team/members/:
    get:
      tags: [Team]
      summary: View all team members
      responses:
        "200":
          description: Team members page

    post:
      tags: [Team]
      summary: Add new team member
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  example: Brahmendra
                last_name:
                  type: string
                  example: Jayaraju
                email:
                  type: string
                  example: brahmendra@example.com
      responses:
        "302":
          description: Redirect after creating member

  /team/members/{member_id}/edit/:
    post:
      tags: [Team]
      summary: Edit team member
      parameters:
        - name: member_id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        "302":
          description: Redirect after editing member

  /team/members/{member_id}/delete/:
    post:
      tags: [Team]
      summary: Delete team member
      parameters:
        - name: member_id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        "302":
          description: Redirect after deleting member

  /audit/api/{correlation_id}/:
    get:
      tags: [Audit]
      summary: Get audit logs (JSON)
      parameters:
        - name: correlation_id
          in: path
          required: true
          schema:
            type: string
            example: 928a0df4-2643-4360-b9a2-d213ee126e00
      responses:
        "200":
          description: Audit logs JSON